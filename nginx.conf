# ================================================
#  Nginx конфігурація для Overdose Parfums
#  Скопіюй цей файл на сервер:
#  sudo cp nginx.conf /etc/nginx/sites-available/perfume-store
#  sudo ln -s /etc/nginx/sites-available/perfume-store /etc/nginx/sites-enabled/
#  sudo nginx -t && sudo systemctl reload nginx
# ================================================

server {
    listen 80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;  # ← Заміни на свій домен

    # Редирект на HTTPS (розкоментуй після налаштування SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Статичні файли Next.js — кешувати агресивно
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Публічні файли (зображення тощо)
    location /images/ {
        alias /var/www/perfume-decants-store/.next/standalone/public/images/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Обмеження розміру запиту
    client_max_body_size 10M;
}

